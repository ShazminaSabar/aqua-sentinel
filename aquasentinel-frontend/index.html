<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Sentinel - Defend. Respond. Survive.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ocean-bg">
    <div class="light-rays"></div>
    <div class="sonar-grid"></div>
    <div class="sonar-sweep"></div>
    <div id="blips-container"></div>
    <div class="ocean-floor"><div class="coral-silhouette"></div></div>
    <div id="bubbles-container" class="bubbles"></div>
</div>

<!-- LOGIN / REGISTRATION MODAL -->
<div id="auth-screen" class="screen active">
    <div class="glass-container hud-frame">
        <div class="hud-corner top-left"></div>
        <div class="hud-corner top-right"></div>
        <div class="hud-corner bottom-left"></div>
        <div class="hud-corner bottom-right"></div>

        <div class="status-badge"><span class="pulse-dot"></span> SYSTEM ONLINE // SECTOR 07</div>

        <h1 class="game-title">AQUA SENTINEL</h1>
        <p class="game-subtitle">DEFEND • RESPOND • SURVIVE</p>

        <div class="auth-tabs">
            <button id="tab-login-btn" class="tab-btn active" onclick="switchAuthTab('login')">ACCESS TERMINAL</button>
            <button id="tab-register-btn" class="tab-btn" onclick="switchAuthTab('register')">NEW ENLISTMENT</button>
        </div>

        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-username">COMMANDER ID</label>
                <input type="text" id="login-username" placeholder="Enter callsign..." required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="login-password">SECURITY KEY</label>
                <input type="password" id="login-password" placeholder="Enter clearance code..." required>
            </div>
            <button type="submit" class="btn-primary"><span>INITIALIZE LINK</span></button>
        </form>

        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="reg-username">ASSIGN CALLSIGN</label>
                <input type="text" id="reg-username" placeholder="Choose unique username..." required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="reg-password">CREATE SECURITY KEY</label>
                <input type="password" id="reg-password" placeholder="Min 6 characters..." required>
            </div>
            <button type="submit" class="btn-primary"><span>REGISTER CREDENTIALS</span></button>
        </form>

        <p id="auth-error" class="error-msg"></p>
    </div>
</div>

<!-- MAIN MENU -->
<div id="menu-screen" class="screen">
    <div class="glass-container menu-container hud-frame">
        <div class="hud-corner top-left"></div>
        <div class="hud-corner top-right"></div>
        <div class="hud-corner bottom-left"></div>
        <div class="hud-corner bottom-right"></div>

        <div class="status-badge"><span class="pulse-dot"></span> SUBMERSIBLE HULL: 100% READY</div>

        <h1 class="game-title">AQUA SENTINEL</h1>
        <p class="welcome-text">WELCOME BACK, COMMANDER <span id="display-username" class="highlight-user">PLAYER</span></p>

        <div class="menu-buttons">
            <a href="html/game.html" class="btn-menu btn-deploy" style="text-decoration: none;">
                <span class="btn-icon">▶</span> DEPLOY MISSION
            </a>
            <a href="html/leaderboard.html" class="btn-menu" style="text-decoration: none;">
                <span class="btn-icon">🏆</span> FLEET LEADERBOARD
            </a>
            <a href="html/profile.html" class="btn-menu" style="text-decoration: none;">
                <span class="btn-icon">👤</span> COMMANDER DOSSIER
            </a>
            <!-- Links directly to the shared standalone settings page -->
            <a href="html/settings.html" class="btn-menu" style="text-decoration: none;">
                <span class="btn-icon">⚙</span> SYSTEM CALIBRATION
            </a>
            <button class="btn-menu btn-logout" onclick="handleLogout()">
                <span class="btn-icon">⏻</span> TERMINATE SESSION
            </button>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
