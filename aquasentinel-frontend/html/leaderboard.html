<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aqua Sentinel - Fleet Leaderboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- External Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body class="profile-body">
<div class="ocean-bg"></div>

<div class="profile-container" style="max-width: 750px;">
    <div class="status-badge">
        <div class="pulse-dot"></div>
        GLOBAL INTEL // LEADERBOARD
    </div>
    <h1>FLEET RANKINGS</h1>

    <div style="margin: 20px 0;">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-family: 'Rajdhani', sans-serif;">
            <thead>
            <tr style="border-bottom: 1px solid rgba(0, 229, 255, 0.3); color: #8ab4f8; font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 2px;">
                <th style="padding: 12px;">RANK</th>
                <th style="padding: 12px;">COMMANDER</th>
                <th style="padding: 12px; text-align: center;">BEST COMBO</th>
                <th style="padding: 12px; text-align: right;">SCORE</th>
            </tr>
            </thead>
            <tbody id="leaderboard-body">
            <tr>
                <td colspan="4" style="text-align: center; padding: 25px; color: #00e5ff; font-family: 'Orbitron', sans-serif;">Syncing fleet telemetry...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="profile-actions">
        <button onclick="window.location.href='../index.html'" class="btn-primary">« Return to Command Menu</button>    </div>
</div>

<script src="../js/leaderboard.js"></script>
</body>
</html>
