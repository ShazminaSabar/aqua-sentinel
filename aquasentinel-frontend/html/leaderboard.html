<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Sentinel - Fleet Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=stylesheet" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/leaderboard.css">
</head>
<body>
<div class="ocean-bg">
    <div class="light-rays"></div>
    <div class="sonar-grid"></div>
    <div class="ocean-floor"><div class="coral-silhouette"></div></div>
</div>

<div class="glass-container leaderboard-container">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="status-badge"><span class="pulse-dot"></span> GLOBAL INTEL // LEADERBOARD</div>
    <h1 class="game-title">FLEET RANKINGS</h1>

    <div class="table-wrapper">
        <table class="leaderboard-table">
            <thead>
            <tr>
                <th>RANK</th>
                <th>COMMANDER</th>
                <th>HIGHEST WAVE</th>
                <th>SCORE</th>
            </tr>
            </thead>
            <tbody id="leaderboard-body">
            <tr><td colspan="4" style="text-align: center; color: #8ab4f8;">Syncing fleet telemetry...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="profile-actions" style="margin-top: 25px;">
        <a href="../index.html" class="btn-secondary">« RETURN TO COMMAND MENU</a>
    </div>
</div>

<script src="../js/leaderboard.js"></script>
</body>
</html>
