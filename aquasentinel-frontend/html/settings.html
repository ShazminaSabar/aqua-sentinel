<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Sentinel - System Calibration</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=stylesheet" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
<div class="ocean-bg">
    <div class="light-rays"></div>
    <div class="sonar-grid"></div>
    <div class="ocean-floor"><div class="coral-silhouette"></div></div>
</div>

<div class="glass-container settings-container">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>
    <!--
          Form structure aided by AI.
          Settings logic, layout paths, and CSS integration authored by me.
     -->
    <div class="status-badge"><span class="pulse-dot"></span> HARDWARE // CONFIGURATION</div>
    <h1 class="game-title">SYSTEM CALIBRATION</h1>

    <div class="settings-form">
        <div class="setting-item">
            <label>AUDIO SONAR FX (SOUND)</label>
            <input type="checkbox" id="sound-toggle" checked onchange="saveSettings()">
        </div>
        <div class="setting-item">
            <label>TACTICAL DIFFICULTY</label>
            <select id="difficulty-select" onchange="saveSettings()">
                <option value="Normal">Normal Defense</option>
                <option value="Hard">Abyssal Hardcore</option>
            </select>
        </div>
    </div>

    <p id="save-status" class="save-msg"></p>

    <div class="profile-actions" style="margin-top: 25px;">
        <a href="../index.html" class="btn-secondary">« RETURN TO COMMAND MENU</a>
    </div>
</div>

<script src="../js/settings.js"></script>
</body>
</html>
