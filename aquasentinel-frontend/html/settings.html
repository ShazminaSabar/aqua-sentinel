<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Sentinel - System Calibration</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/game.css">
</head>
<body>

<!-- IMMERSIVE UNDERWATER ENVIRONMENT -->
<div class="ocean-bg">
    <div class="light-rays"></div>
    <div class="sonar-grid"></div>
    <div class="ocean-floor"><div class="coral-silhouette"></div></div>
</div>

<!-- DEDICATED SETTINGS PAGE CONTAINER -->
<div class="modal-overlay active" style="position: relative; background: transparent; backdrop-filter: none;">
    <div class="menu-card settings-card" style="margin: auto; width: 500px;">
        <div class="status-badge" style="margin-bottom: 12px; text-align: center;"><span class="pulse-dot"></span> HARDWARE // CONFIGURATION</div>
        <h2 class="menu-title" style="text-align: center; font-size: 24px; margin-bottom: 20px;">System Calibration</h2>

        <!-- Audio Option -->
        <div class="settings-section" style="display: flex; align-items: center; justify-content: space-between;">
            <label class="settings-label" style="margin-bottom: 0;">Audio Sonar FX (Sound)</label>
            <input type="checkbox" id="global-sound-toggle" checked style="width: 20px; height: 20px; accent-color: #00e5ff; cursor: pointer;" onchange="playTestSonarSound()">
        </div>

        <!-- Tactical Difficulty Option -->
        <div class="settings-section">
            <label class="settings-label">Tactical Difficulty</label>
            <div class="difficulty-group">
                <button type="button" class="btn-diff" onclick="selectDifficulty('Easy', this)">Easy</button>
                <button type="button" class="btn-diff active" onclick="selectDifficulty('Normal', this)">Normal</button>
                <button type="button" class="btn-diff" onclick="selectDifficulty('Hard', this)">Hard</button>
            </div>
        </div>

        <!-- Mission Protocols Guidance -->
        <div class="settings-section">
            <label class="settings-label">Mission Protocols</label>
            <p class="settings-desc">Detect incoming hostile signatures, override security via Fish Game API decryption modules, and safeguard sector integrity.</p>
        </div>

        <!-- Action Buttons -->
        <div class="menu-actions dual-actions" style="margin-top: 20px;">
            <button class="btn-menu-action btn-secondary-action" onclick="saveGlobalSettings()">Save</button>
            <button class="btn-menu-action btn-secondary-action" onclick="goBackToMenu()">Back</button>
        </div>
    </div>
</div>

<script>
    // Load saved settings on page load
    let currentSelectedDifficulty = localStorage.getItem('aquaDifficulty') || 'Normal';
    const savedSound = localStorage.getItem('aquaSound');

    if (savedSound !== null) {
        document.getElementById('global-sound-toggle').checked = (savedSound === 'true');
    }

    // Highlight active difficulty button
    document.querySelectorAll('.btn-diff').forEach(b => {
        if (b.innerText.toLowerCase() === currentSelectedDifficulty.toLowerCase()) {
            b.classList.add('active');
        } else {
            b.classList.remove('active');
        }
    });

    function selectDifficulty(level, btnElement) {
        document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        currentSelectedDifficulty = level;
    }

    function playTestSonarSound() {
        const soundEnabled = document.getElementById('global-sound-toggle').checked;
        if (!soundEnabled) return;

        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Sonar ping frequency
            osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.3);

            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } catch (e) {
            console.log("AudioContext blocked or unsupported.");
        }
    }

    function saveGlobalSettings() {
        const soundEnabled = document.getElementById('global-sound-toggle').checked;
        localStorage.setItem('aquaDifficulty', currentSelectedDifficulty);
        localStorage.setItem('aquaSound', soundEnabled);

        playTestSonarSound();
        goBackToMenu();
    }

    function goBackToMenu() {
        const referrer = document.referrer;
        if (referrer && referrer.includes('game.html')) {
            window.location.href = 'game.html';
        } else {
            window.location.href = '../index.html';
        }
    }
</script>
</body>
</html>
